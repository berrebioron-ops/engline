const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(code) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(VAULT.salt), iterations: VAULT.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const id = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(VAULT.salt + code)))).slice(0, 8)
    .map((x) => x.toString(16).padStart(2, '0')).join('');
  const slot = VAULT.slots[id];
  if (!slot) throw new Error('code');
  const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(slot.iv) }, kek, b64(slot.data));
  const info = JSON.parse(new TextDecoder().decode(raw));
  const key = await crypto.subtle.importKey('raw', b64(info.key), 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.data)));
  return { info, html };
}
async function open(code) {
  const { info, html } = await unlock(code);
  try {
    localStorage.setItem('engline_code', code);
    if (!localStorage.getItem('engline_name')) localStorage.setItem('engline_name', info.name);
    localStorage.setItem('engline_gender', info.g);
  } catch (e) { /* */ }
  document.open(); document.write(html); document.close();
}
const saved = (() => { try { return localStorage.getItem('engline_code'); } catch (e) { return null; } })();
const gate = document.getElementById('gate');
(saved ? open(saved) : Promise.reject()).catch(() => gate.classList.remove('hidden'));
gate.onsubmit = async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.replace(/\D/g, '');
  try { await open(code); } catch (err) { document.getElementById('err').textContent = 'הקוד לא נכון'; }
};
